name: Sync PoliMetrics feed

on:
  schedule:
    - cron: "0 14 * * 1"    # Mondays, 14:00 UTC (7:00 am Arizona)
  workflow_dispatch:         # run on demand from the Actions tab after publishing

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch feed
        run: python scripts/fetch-polimetrics.py
      - name: Commit if changed
        run: |
          git config user.name "polimetrics-sync"
          git config user.email "actions@users.noreply.github.com"
          git add assets/data/polimetrics.json
          if git diff --cached --quiet; then
            echo "Feed unchanged"
          else
            git commit -m "Sync PoliMetrics feed"
            git push
          fi
